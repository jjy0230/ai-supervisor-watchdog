# AI Supervisor Watchdog 配置
driver_type: "desktop"          # 驱动模式: "desktop" (Cursor/VS Code) | "cli" (命令行Agent) | "mock" (本地测试)
window_title: "Cursor"          # 监听目标桌面窗口标题关键字
poll_interval: 2.0              # 轮询探测间隔 (秒)
stagnation_timeout: 4.0         # 认定停顿的静默时长阈值 (秒)

tasks_file: "tasks.md"          # 任务检查清单路径
project_root: "."               # 待监控的项目根目录

# 仲裁模型配置 (支持 anthropic / openai / deepseek / gemini / mock)
llm_provider: "anthropic"
model_name: "claude-3-5-sonnet-20241022"
# api_key: "sk-..."             # 若不填则自动读取环境变量 ANTHROPIC_API_KEY
max_tokens: 800
temperature: 0.1

# 物理传感器配置 (零 Token 真实证据链)
run_tests: true
test_command: "pytest -q"
run_lint: true

# 防死锁熔断保护
max_retries_per_task: 3
max_consecutive_failures: 5
similarity_threshold: 0.85
